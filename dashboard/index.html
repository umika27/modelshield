<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ModelShield — Release Analysis</title>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-theme="dark">
  <header class="topbar">
    <div class="topbar-left">
      <div class="brand-logo">
        <i class="ri-shield-check-line brand-icon" aria-hidden="true"></i>
        <div class="brand-text">
          <span class="brand-name">MODELSHIELD</span>
          <span class="brand-subtitle">Pre-deployment intelligence</span>
        </div>
      </div>
      <div class="topbar-divider" aria-hidden="true"></div>
      <div class="repo-info"><span class="meta-label">Workspace:</span><strong class="meta-value mono">modelshield</strong></div>
    </div>
    <div class="topbar-right">
      <button class="btn-topbar-primary" id="btn-load-latest" type="button" title="Load the latest completed analysis">
        <i class="ri-refresh-line" aria-hidden="true"></i><span>Load Latest Analysis</span>
      </button>
    </div>
  </header>

  <div class="analysis-context" aria-label="Current analysis context">
    <div><span>Candidate</span><output class="mono" id="model-select">No analysis loaded</output></div>
    <div><span>Baseline</span><output class="mono" id="baseline-select">No analysis loaded</output></div>
  </div>

  <div class="app-container">
    <div class="center-column">
      <nav class="breadcrumb-bar" aria-label="Analysis location">
        <div class="breadcrumb-left">
          <i class="ri-home-4-line breadcrumb-home" aria-hidden="true"></i>
          <span class="breadcrumb-item">modelshield</span><span class="breadcrumb-sep" aria-hidden="true">/</span>
          <span class="breadcrumb-item" id="crumb-candidate">no analysis</span><span class="breadcrumb-sep" aria-hidden="true">/</span>
          <span class="breadcrumb-item active">release analysis</span>
        </div>
      </nav>
      <main class="main-view" id="view-content"></main>
    </div>
  </div>

  <footer class="statusbar">
    <div class="statusbar-left">
      <div class="status-item"><i class="ri-shield-check-line" style="color: var(--accent-blue);" aria-hidden="true"></i><span>ModelShield analysis</span></div>
      <div class="status-item"><span style="color: var(--text-muted);">model:</span><span class="status-item-highlight mono" id="sb-model">unavailable</span></div>
      <div class="status-item"><span style="color: var(--text-muted);">replays:</span><span class="status-item-highlight mono" id="sb-reg-count">unavailable</span></div>
      <div class="status-item"><span style="color: var(--text-muted);">decision:</span><span class="mono" id="sb-policy">unavailable</span></div>
    </div>
    <div class="statusbar-right"><div class="status-item"><span>Evidence status appears after analysis.</span></div></div>
  </footer>
  <script type="module" src="app.js"></script>
</body>
</html>
