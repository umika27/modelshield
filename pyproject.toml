[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modelshield"
version = "1.0.0"
description = "ModelShield: Adaptive ML Verification & Regression Release Gating Layer"
readme = "README.md"
authors = [{ name = "ModelShield Engineering", email = "engineering@modelshield.dev" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = [
    "typer>=0.9.0",
    "pydantic>=2.0.0",
    "torch>=2.0.0",
    "numpy>=1.20.0",
    "requests>=2.28.0",
    "python-dotenv>=1.0.0"
]

[project.scripts]
modelshield = "cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cli*", "core*", "regression*", "adaptive*", "challenges*"]
exclude = ["tests*", "dashboard*"]
